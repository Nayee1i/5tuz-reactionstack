  #     retries: 10

  redis:
    image: redis:7-alpine
    container_name: hackathon_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: hackathon_backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: "postgresql://postgres:pHbaQgegqELmViKiYAxIKSsgUYdycDuj@altaria.proxy.rlwy.net:58643/railway?sslmode=require"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
    ports:
      - "3001:3001"
    depends_on:
      # postgres:
      #   condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./backend:/app
    command: sh -c "npx prisma generate && npm start"


  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: hackathon_frontend
    ports:
      - "3000:3000" # Или 5173:5173, если у тебя Vite (проверь package.json)
    environment:
      # ВАЖНО: используем имя сервиса 'backend', а не localhost!
      - REACT_APP_API_URL=http://backend:3001 
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
  

  nginx:
    image: nginx:alpine
    container_name: hackathon_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/html:/usr/share/nginx/html
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

