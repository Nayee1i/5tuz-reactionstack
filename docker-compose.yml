version: '3.8'

services:
  # База данных PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: hackathon_db
    environment:
      POSTGRES_DB: tomsk_org
      POSTGRES_USER: hackathon
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hackathon2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackathon -d tomsk_org"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis для кэширования (опционально, но полезно)
  redis:
    image: redis:7-alpine
    container_name: hackathon_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Backend (Node.js)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackathon_backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://hackathon:${DB_PASSWORD:-hackathon2026}@postgres:5432/tomsk_org
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackathon_frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:3001
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # Nginx как reverse proxy
  nginx:
    image: nginx:alpine
    container_name: hackathon_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/html:/usr/share/nginx/html
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data: